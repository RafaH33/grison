<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    font-family: 'DM Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    position: relative;
    background: #EEF4FA;
  }

  .bg {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 82% 18%, rgba(156,213,255,0.42) 0%, transparent 58%),
      radial-gradient(ellipse at 12% 92%, rgba(122,170,206,0.26) 0%, transparent 55%),
      linear-gradient(140deg, #FBFDFF 0%, #EEF4FA 55%, #DFEAF5 100%);
  }

  .dots {
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(53,88,114,0.075) 1px, transparent 1px);
    background-size: 34px 34px;
  }

  /* soft glass ring, echoes the notebook diagram in the ad */
  .ring {
    position: absolute;
    border-radius: 50%;
    border: 1px solid rgba(53,88,114,0.13);
  }
  .ring-1 { width: 360px; height: 360px; top: -70px;  right: 96px; }
  .ring-2 { width: 220px; height: 220px; top:  16px;  right: 166px; }

  .glow {
    position: absolute;
    width: 300px; height: 300px;
    border-radius: 50%;
    right: -60px; bottom: -110px;
    background: radial-gradient(circle, rgba(240,83,20,0.11) 0%, transparent 70%);
  }

  .content {
    position: relative;
    z-index: 10;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 64px 84px;
  }

  .eyebrow {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.185em;
    text-transform: uppercase;
    color: #4E7E9E;
    margin-bottom: 26px;
  }

  .logo {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 104px;
    font-weight: 700;
    color: #1C3A50;
    line-height: 0.95;
    letter-spacing: -0.025em;
    margin-bottom: 26px;
  }

  .rule {
    width: 64px;
    height: 4px;
    border-radius: 100px;
    background: #F05314;
    margin-bottom: 26px;
  }

  .tagline {
    font-size: 27px;
    font-weight: 500;
    color: #1C3A50;
    line-height: 1.34;
    max-width: 600px;
    margin-bottom: 42px;
  }

  .pills { display: flex; gap: 11px; }

  .pill {
    padding: 9px 22px;
    border-radius: 100px;
    border: 1px solid rgba(53,88,114,0.20);
    background: rgba(255,255,255,0.70);
    box-shadow: inset 0 2px 0 rgba(255,255,255,0.95), 0 2px 10px rgba(53,88,114,0.09);
    font-size: 14px;
    font-weight: 600;
    color: #355872;
    letter-spacing: -0.005em;
  }

  .url {
    position: absolute;
    bottom: 44px;
    right: 84px;
    font-size: 14px;
    font-weight: 600;
    color: #6B9AB8;
    letter-spacing: 0.04em;
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="dots"></div>
  <div class="ring ring-1"></div>
  <div class="ring ring-2"></div>
  <div class="glow"></div>

  <div class="content">
    <div class="eyebrow">AI Consulting &nbsp;·&nbsp; Automation &nbsp;·&nbsp; AI Agents</div>
    <div class="logo">Nextwith</div>
    <div class="rule"></div>
    <div class="tagline">Your business is faster than you think.<br>We find what's slowing it down.</div>
    <div class="pills">
      <div class="pill">AI Audit</div>
      <div class="pill">Automation</div>
      <div class="pill">AI Agents</div>
    </div>
  </div>

</body>
</html>
